[package]
name = "pp-db"
version = "0.1.0"
edition = "2021"
description = "SQLite 数据层:schema、迁移、仓储。"

[dependencies]
pp-common = { path = "../pp-common", features = ["backend"] }
# `bundled`:把 SQLite 源码静态编进二进制,不依赖系统 sqlite3.dll(零依赖分发的前提)。
# 版本与 velo 保持一致。
rusqlite = { version = "0.31", features = ["bundled"] }
# v7 = 按时间有序的 UUID:主键天然按创建顺序排列,将来做同步也不会撞
uuid = { version = "1", features = ["v7"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
