# 每次推送 / PR:全部单测(含需要真引擎的那几组)+ 前端类型检查。
#
# 只在 Windows 上跑:私有仓库的 Actions 分钟数 Windows 按 2 倍、macOS 按 10 倍计,
# macOS 的构建放在发版流程(release.yml)里验证;想单独验证 macOS,手动触发 release.yml 即可(不会发布)。
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # TLS 用的 aws-lc 在 Windows 上要 NASM 编汇编(没有时会退回预编译的目标文件,装上更稳)
      - uses: ilammy/setup-nasm@v1

      # 建模引擎:和发版用的是同一份版本锁。装好之后用 PRINTPILOT_CAD_PYTHON 指给测试,
      # 这样「需要真引擎」的测试在 CI 上是真的跑了,而不是被跳过。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/engine/constraints.txt

      - name: Install the CAD engine (build123d)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary -c scripts/engine/constraints.txt build123d==0.12.0
          echo "PRINTPILOT_CAD_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Engine tests (executor + every API the prompt teaches)
        shell: bash
        working-directory: crates/pp-cad/py
        run: python -X utf8 -m unittest discover -s . -t . -v

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Frontend type-check (wasm)
        run: cargo check --target wasm32-unknown-unknown -p printpilot-ui --locked
